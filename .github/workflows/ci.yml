# SPDX-License-Identifier: AGPL-3.0-or-later
# Builds and tests the core on every target of spec §2.1 (TST-003).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OWFAX_COMMON_FLAGS: -DOWFAX_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=Release

jobs:
  linux:
    name: Linux ${{ matrix.arch }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, compiler: gcc,   runner: ubuntu-24.04,     cxx: g++ }
          - { arch: amd64, compiler: clang, runner: ubuntu-24.04,     cxx: clang++ }
          - { arch: arm64, compiler: gcc,   runner: ubuntu-24.04-arm, cxx: g++ }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install tools
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          ninja-build libasound2-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} $OWFAX_COMMON_FLAGS
          -DOWFAX_WITH_ALSA=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test CLI and daemon
        run: |
          ./build/apps/cli/owfax-cli --version && ./build/apps/cli/owfax-cli --capabilities
          ./build/apps/daemon/owfaxd --version && ./build/apps/daemon/owfaxd --list-inputs

  linux-armhf:
    name: Linux armhf (Raspberry Pi 32-bit, cross + qemu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-arm-linux-gnueabihf qemu-user
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja $OWFAX_COMMON_FLAGS
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/linux-armhf.cmake
      - name: Build
        run: cmake --build build
      - name: Test (qemu-arm)
        run: ctest --test-dir build --output-on-failure

  debian:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    container: debian:${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: bookworm, archived: false, label: "Debian 12 (supported floor)" }
          - { suite: bullseye, archived: true,  label: "Debian 11 (best effort, CMake 3.18)" }
    steps:
      - name: Refresh apt
        if: ${{ !matrix.archived }}
        run: apt-get update -q
      # Bullseye is end-of-life: packages now live on archive.debian.org. All three
      # suites are needed so that versions match those already in the image.
      - name: Point apt to the Debian archive
        if: ${{ matrix.archived }}
        run: |
          rm -f /etc/apt/sources.list.d/*
          cat > /etc/apt/sources.list <<'LIST'
          deb http://archive.debian.org/debian bullseye main
          deb http://archive.debian.org/debian bullseye-updates main
          deb http://archive.debian.org/debian-security bullseye-security main
          LIST
          apt-get -o Acquire::Check-Valid-Until=false update -q
      - name: Install tools
        run: >
          apt-get -o Acquire::Check-Valid-Until=false install -y --no-install-recommends
          cmake g++ make git ca-certificates libasound2-dev
      - uses: actions/checkout@v4
      - name: Configure, build, test
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B build $OWFAX_COMMON_FLAGS -DOWFAX_WITH_ALSA=ON
          cmake --build build -j"$(nproc)"
          cd build && ctest --output-on-failure

  windows:
    name: Windows ${{ matrix.arch }} (MSVC, Win7 API level)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.arch }} -DOWFAX_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Smoke test CLI
        run: |
          build\apps\cli\Release\owfax-cli.exe --version
          build\apps\cli\Release\owfax-cli.exe --capabilities
          build\apps\daemon\Release\owfaxd.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: owfax-cli-windows-${{ matrix.arch }}
          path: |
            build/apps/cli/Release/owfax-cli.exe
            build/apps/daemon/Release/owfaxd.exe

  android:
    name: Android ${{ matrix.abi }} (API 21)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja $OWFAX_COMMON_FLAGS
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-21
          -DOWFAX_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build

  corpus:
    name: Real receptions (corpus regression, TST-002)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Cache corpus
        uses: actions/cache@v4
        with:
          path: tests/corpus/data
          key: corpus-${{ hashFiles('tests/corpus/corpus.tsv') }}
      - name: Fetch corpus (SHA-256 checked)
        run: bash tools/corpus/fetch.sh
      - name: Build
        run: |
          cmake -S . -B build -G Ninja $OWFAX_COMMON_FLAGS
          cmake --build build
      - name: Decode every real reception, compare with its baseline
        run: OWFAX_CORPUS_DIR=tests/corpus/data ./build/tests/owfax_tests

  capture-scripts:
    name: Capture scripts (relay protection, syntax)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: bash -n tools/capture/*.sh tools/capture/tests/*.sh tools/station/*.sh
      - name: Band-change guard (spec CAT-009)
        run: bash tools/capture/tests/test_band_guard.sh

  web:
    name: Web interface (JavaScript syntax, translations)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check web/app.js
      - name: Translations complete (UI-005)
        run: python3 tools/web/check_i18n.py

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          find core io net vitrine apps tests \( -name '*.hpp' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format-18 --dry-run --Werror
