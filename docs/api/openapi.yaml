# SPDX-License-Identifier: AGPL-3.0-or-later
# Local HTTP API of owfaxd (spec ARC-002, ARC-005, DSP-007, UI-006, UI-008).
openapi: 3.0.3
info:
  title: openWeatherFaxSSB local API
  version: "1"
  description: |
    Served by the reception engine (`owfaxd --http <port>`) on the local network
    only: clients outside loopback, 10/8, 172.16/12, 192.168/16 and 169.254/16 get
    403 (spec NFR-006). Everything is readable; changing the station settings needs a
    skipper session (UI-002): `Authorization: Bearer <token>` from POST /api/v1/session.
    Receive only: no endpoint can make the radio transmit.

    Every error has a JSON body `{"error": "<message>"}`.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: http://owfax.local:8080
paths:
  /api/v1/info:
    get:
      summary: Version, source code link (AGPL-3.0 §13) and audio input
      responses:
        "200":
          description: Build information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }
  /api/v1/status:
    get:
      summary: Engine state, refreshed every 5 s and at each chart start or end
      responses:
        "200":
          description: Same content as status.json in the charts directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /api/v1/settings:
    get:
      summary: Station settings, their version, whether a skipper password exists
      description: |
        Available when owfaxd runs with `--config <file>` (404 otherwise).
        `restart_required`: a new audio input was chosen, used at the next start.
      responses:
        "200":
          description: |
            `{"version", "password_set", "logged_in", "restart_required",
            "running_input", "settings": {"label", "shift_hz", "start_without_apt",
            "enhanced", "input", "station"}}`; `station` = catalogue id chosen in the
            setup assistant (UI-003).
          content:
            application/json:
              schema: { type: object }
    put:
      summary: Change the settings (skipper session)
      description: |
        Body `{"version": <the version read>, "settings": {...}}` (members not given
        keep their value). 409 with the current settings if someone else changed them
        meanwhile (UI-004). Applied between two charts, never during a reception.
      security: [{ skipper: [] }]
      responses:
        "200": { description: Saved; same body as GET }
        "400": { description: Invalid value (the error says which) }
        "401": { description: No valid skipper session }
        "409": { description: Version conflict; body = current settings }
  /api/v1/session:
    post:
      summary: Skipper login
      description: |
        Body `{"password": "…"}`. Returns `{"token", "expires_in"}` (12 h). After 5
        failures, 429 for 30 s. 409 while no password exists yet.
      responses:
        "200": { description: Logged in }
        "401": { description: Wrong password }
        "409": { description: No skipper password yet }
        "429": { description: Too many failures, see Retry-After }
    delete:
      summary: Skipper logout (ends the session of the bearer token)
      responses:
        "200": { description: Logged out }
  /api/v1/password:
    post:
      summary: Create the skipper password (first setup) or change it
      description: |
        First setup: `{"new": "…"}` (8 characters at least), allowed while no password
        exists, and logs in. Change: skipper session and `{"current": "…", "new": "…"}`;
        every other session is closed. Stored as PBKDF2-HMAC-SHA256 (100 000
        iterations, random salt), never in clear.
      responses:
        "200": { description: "`{\"token\", \"expires_in\"}`" }
        "400": { description: Too short }
        "401": { description: No session, or wrong current password }
  /api/v1/diagnostics:
    get:
      summary: Host, hardware tier, audio inputs and options (UI-007)
      responses:
        "200":
          description: |
            `{"host": {"os", "cpu_cores", "ram_bytes", "tier"}, "input": {"uri",
            "description", "sample_rate"}, "backends": [...], "inputs": [{"uri",
            "description"}], "options": {"label", "shift_hz", "start_without_apt",
            "enhanced"}}`
          content:
            application/json:
              schema: { type: object }
  /api/v1/journal:
    get:
      summary: The engine journal (last 512 KiB), for bug reports (UI-007)
      responses:
        "200":
          description: Plain text, offered as a download
          content:
            text/plain:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/charts:
    get:
      summary: Charts received, newest first
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 200 }
      responses:
        "200":
          description: Chart metadata, one object per chart
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Chart" }
  /api/v1/charts/{stem}:
    parameters:
      - $ref: "#/components/parameters/Stem"
    get:
      summary: One chart's metadata
      responses:
        "200":
          description: Chart metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chart" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/charts/{stem}/{image}:
    parameters:
      - $ref: "#/components/parameters/Stem"
      - name: image
        in: path
        required: true
        description: |
          live.png: preview built during reception (rewritten every 50 lines, not
          cached); raw.png: final image as received, the reference (DSP-030);
          enhanced.png: with the enhancements listed in the metadata (UI-008, UI-009).
        schema: { type: string, enum: [live.png, raw.png, enhanced.png] }
      - name: levels
        in: query
        description: |
          16: light display version (16 grey levels, 4-bit PNG, full resolution),
          about 3.5x smaller on real charts (2.3 MB to 0.6 MB for a DWD chart); made
          on the first request and cached. 256 (default): the stored image, lossless.
        schema: { type: integer, enum: [16, 256], default: 256 }
    get:
      summary: One version of a chart image
      responses:
        "200":
          description: Grey-level PNG
          content:
            image/png:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/stations:
    get:
      summary: Station catalogue (owfax-station JSON files, see catalog/)
      responses:
        "200":
          description: One object per station
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/stations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, example: dwd-pinneberg }
    get:
      summary: One station
      responses:
        "200":
          description: Station
          content:
            application/json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/live:
    get:
      summary: Live stream over WebSocket (DSP-007)
      description: |
        RFC 6455 WebSocket, text messages from server to client, each a JSON object
        with a `type`:

        - `status`: `{"type": "status", "status": <Status>}`, first message, then
          every 5 s and at each chart start or end;
        - `start`: `{"type": "start", "stem", "ioc", "start": "apt"|"signal"|"forced"}`;
        - `lock`: `{"type": "lock", "stem", "clock_ppm", "tuning_offset_hz",
          "phasing_found"}`, image lines follow;
        - `line`: `{"type": "line", "stem", "index", "width", "quality",
          "pixels"}`, `pixels` = base64 of `width` grey levels (0 black … 255 white),
          about two lines per second;
        - `complete`: `{"type": "complete", "stem", "discarded", "lines"}`, the chart
          files are written (or the transmission was discarded as a fragment);
        - `spectrum`: `{"type": "spectrum", "max_hz", "db_min", "db_max", "bands",
          "rms_dbfs", "peak_dbfs", "clipped"}`, four times per second while a client
          is connected: input audio spectrum from 0 to `max_hz`, `bands` = base64 of
          one byte per band (0 = `db_min`, 255 = `db_max`, dB relative to a
          full-scale sine), level and clipped samples of the last 0.25 s (UI-007,
          UI-003).

        A client too slow to keep up loses the oldest messages (more than 512
        waiting); it can always reload `live.png`. Messages sent by the client are
        ignored, except ping and close.
      responses:
        "101": { description: Switching to the WebSocket protocol }
        "426": { description: Plain HTTP request without a WebSocket upgrade }
  /{path}:
    get:
      summary: Web interface (static files of `--web <dir>`, or a built-in page)
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: File }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    skipper:
      type: http
      scheme: bearer
  parameters:
    Stem:
      name: stem
      in: path
      required: true
      description: YYYYMMDDTHHMMZ_<label>, as in the chart file names
      schema: { type: string, example: 20261110T0735Z_GYA_4610kHz }
  responses:
    NotFound:
      description: Unknown resource
      content:
        application/json:
          schema:
            type: object
            properties: { error: { type: string } }
  schemas:
    Info:
      type: object
      properties:
        name: { type: string }
        version: { type: string }
        git_revision: { type: string }
        license: { type: string }
        source_url: { type: string, description: "Exact source of this build (UI-006)" }
        api_version: { type: integer, example: 1 }
        receive_only: { type: boolean, example: true }
        input: { type: string }
    Status:
      type: object
      properties:
        updated_utc: { type: string, example: "2026-11-10 20:10:00Z" }
        input: { type: string }
        state: { type: string, enum: [starting, listening, receiving, stopped] }
        phase:
          type: string
          enum: [listening, phasing, image]
          description: "Step of the reception: waiting, chart started (phasing), decoding"
        start: { type: string, enum: ["", apt, signal, forced] }
        lines: { type: integer, description: "Live lines of the chart being received" }
        current: { type: string, description: "Stem of the chart being received, or empty" }
        audio_s: { type: number }
        queued_samples: { type: integer }
        overruns: { type: integer }
        dropped_samples: { type: integer }
        charts: { type: integer }
        live_clients: { type: integer }
    Chart:
      type: object
      properties:
        stem: { type: string }
        label: { type: string }
        start_utc: { type: string, example: 20261110T0735Z }
        start_unix: { type: integer }
        duration_s: { type: number }
        ioc: { type: integer, enum: [576, 288] }
        apt_start: { type: boolean }
        start: { type: string, enum: [apt, signal, forced] }
        phasing_found: { type: boolean }
        live_lines: { type: integer }
        lines: { type: integer }
        clock_ppm: { type: number }
        tuning_offset_hz: { type: number }
        quality: { type: number, minimum: 0, maximum: 1 }
        enhancements: { type: array, items: { type: string } }
        clicks_repaired: { type: integer }
